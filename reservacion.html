<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Reserva - Sistema de Reservas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Reservas</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Disponibilidad</a></li>
                <li><a href="mis-reservas.html">Mis Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Nueva Reserva</h2>

        <!-- Región accesible para errores (P02_error)[span_4](start_span)[span_4](end_span) -->
        <div id="mensaje-error" role="alert" aria-live="polite" class="alerta-error">
            <h3>No se pudo crear la reserva</h3>
            <p>El horario (10:30 a 11:30) se cruza con una reserva activa de 10:00 a 11:00. Elige otro intervalo[span_5](start_span)[span_5](end_span).</p>
        </div>

        <form id="form-reserva" action="confirmacion.html" method="GET">
            <div class="campo">
                <label for="recurso">Recurso:</label>
                <select id="recurso" name="recurso" required>
                    <option value="sala-a" selected>Sala A</option>
                    <option value="sala-b">Sala B</option>
                </select>
            </div>

            <div class="campo">
                <label for="fecha">Fecha (dd/mm/aaaa):</label>
                <input type="date" id="fecha" name="fecha" value="2026-11-05" required>
            </div>

            <div class="campo">
                <label for="hora-inicio">Hora inicial (24h):</label>
                <input type="time" id="hora-inicio" name="hora-inicio" value="10:30" required>
            </div>

            <div class="campo">
                <label for="hora-fin">Hora final (24h):</label>
                <input type="time" id="hora-fin" name="hora-fin" value="11:30" required>
            </div>

            <div class="acciones-form">
                <button type="submit" class="btn-primario">Reservar espacio</button>
                <a href="index.html" class="btn-secundario">Volver</a>
            </div>
        </form>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
